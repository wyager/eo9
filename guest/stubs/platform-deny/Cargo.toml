[package]
name = "eo9-stub-platform-deny"
description = "Eo9 standard stub provider `platform.deny`: exports eo9:platform/platform with every operation refusing typed (denied) — the refusal stub for required platform-device imports."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# A core wasm module that `cargo xtask build-guest` turns into a component.
crate-type = ["cdylib"]

[dependencies]
eo9-guest = { workspace = true }
wit-bindgen = { workspace = true }
