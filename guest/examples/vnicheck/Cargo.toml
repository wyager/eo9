[package]
name = "eo9-example-vnicheck"
description = "Eo9 example program: verify the virtual-NIC switch's per-port MACs and delivery policy (own unicast, broadcast to all, unknown unicast dropped, source rewrite) over two switch ports wired into its link-a / link-b slots (targets the eo9-examples:vnicheck/vnicheck world)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# A core wasm module that `cargo xtask build-guest` turns into a component.
crate-type = ["cdylib"]

[dependencies]
eo9-guest = { workspace = true }
wit-bindgen = { workspace = true }
