[package]
name = "eo9-example-hidcheck"
description = "Eo9 example program: configure the boot-protocol HID interface of a USB device and print decoded interrupt-IN reports with a reports/s counter (targets the eo9-examples:hidcheck/hidcheck world: usb + time + text)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# A core wasm module that `cargo xtask build-guest` turns into a component.
crate-type = ["cdylib"]

[dependencies]
eo9-guest = { workspace = true }
# Descriptor parsing + HID boot-report decode (the host-tested core).
eo9-ohci = { workspace = true }
wit-bindgen = { workspace = true }
