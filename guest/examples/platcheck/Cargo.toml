[package]
name = "eo9-example-platcheck"
description = "Eo9 example program: probe the granted eo9:platform capability's full typed contract - enumerate, claim, busy, out-of-range, cross-region denial, not-found - one line per probe (targets the eo9-examples:platcheck/platcheck world: platform + text)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# A core wasm module that `cargo xtask build-guest` turns into a component.
crate-type = ["cdylib"]

[dependencies]
eo9-guest = { workspace = true }
wit-bindgen = { workspace = true }
