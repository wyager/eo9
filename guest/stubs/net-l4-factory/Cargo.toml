# The shareable transport tail (shared-resources design §5.2).
[package]
name = "eo9-stub-net-l4-factory"
description = "Eo9 standard stub provider `l4.factory`: re-exports an underlying eo9:net/l4 transport unchanged and adds the blessed eo9:net/l4-factory export, making the composition shareable through the kernel call gate (one minted handler per consumer wiring)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# A core wasm module that `cargo xtask build-guest` turns into a component.
crate-type = ["cdylib"]

[dependencies]
eo9-guest = { workspace = true }
wit-bindgen = { workspace = true }
