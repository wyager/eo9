# The address allow-list admit policy for pci.filtered ("policies are programs").
[package]
name = "eo9-stub-pci-admit-address"
description = "Eo9 standard policy `pci.admit-address`: an eo9:pci/admit-policy component admitting exactly a configured allow-list of device addresses. Pure (imports nothing); composed as `pci.admit-address --allow ... $ pci.filtered $ driver`."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# A core wasm module that `cargo xtask build-guest` turns into a component.
crate-type = ["cdylib"]

[dependencies]
eo9-guest = { workspace = true }
wit-bindgen = { workspace = true }
