[package]
name = "eo9-stub-gfx-deny"
description = "Eo9 standard stub provider `gfx.deny`: exports eo9:gfx/gfx with every operation failing with the API's own denied error (refusal of the pixel-output capability)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# A core wasm module that `cargo xtask build-guest` turns into a component.
crate-type = ["cdylib"]

[dependencies]
eo9-guest = { workspace = true }
wit-bindgen = { workspace = true }
