# The Eo9 bare-metal kernel (area 12: aarch64 and riscv64 on QEMU `virt`).
#
# Build and run it via xtask — `cargo xtask build-kernel <arch>` and `cargo xtask qemu
# <arch>` — which supply the target, the linker script, and (for the `wasm-*` features)
# the host-precompiled artifacts. A plain host build (as done by `cargo test` in this
# workspace) compiles to a stub binary so the workspace stays testable on the host triple.
[package]
name = "eo9-kernel"
description = "Eo9 bare-metal kernel: boot, serial, heap, timer, kernel-side eo9 root providers, and a wasmtime-based runner for precompiled components on QEMU virt (aarch64, riscv64 in progress)."
version.workspace = true
edition.workspace = true
publish.workspace = true

[build-dependencies]
# The compiler fingerprint (build.rs): blake3 over kernel/vendor/** + engine-config
# sources, emitted into every persistent compile-cache key.
blake3 = { version = "1.8.5", default-features = false }

[features]
# Embed the host-precompiled seed wasm component (built by `cargo xtask build-kernel
# aarch64`, passed in via the EO9_SEED_CWASM environment variable) and run it at boot.
wasm-seed = ["dep:wasmtime"]
# Embed the host-precompiled eo9-example-hello program (EO9_HELLO_CWASM) and run it at
# boot against the kernel's root providers: text -> PL011 serial, time -> generic timer +
# PL031 RTC, entropy -> counter-seeded splitmix64.
wasm-hello = ["dep:wasmtime"]
# Embed the host-precompiled async artifacts (EO9_SLEEPY_CWASM — the kernel-local async
# canary that awaits `eo9:time/time.sleep` — and EO9_ENTROPY_SEEDED_CWASM — the unmodified
# `entropy.seeded` stub from the guest workspace, whose `configure` export uses the async
# canonical ABI) and run them at boot through the component-model-async machinery.
wasm-async = ["dep:wasmtime"]
# Embed the read-only store image assembled by xtask (EO9_STORE_IMAGE: shell-named
# components plus their host-AOT artifacts) and the headless runner that the kernel
# command line's `program=<name> [arg=value …]` selects from.
wasm-store = ["dep:wasmtime"]
# On-target codegen (plan/12 Decisions 26–28): compile WebAssembly into native aarch64 on the
# machine itself, via Cranelift + the wasmtime compile layers built no_std (see
# kernel/vendor). Off by default so `cargo xtask ci` (featureless kernel) stays lean.
# Also links the no_std component algebra (eo9-component) so the shell can compose ($/&/
# only/configure) and compile the fused result on-target (plan/12 Decisions 30–35).
wasm-codegen = ["dep:wasmtime", "wasmtime/cranelift", "dep:eo9-component", "dep:blake3"]
# The persistent store disk (plan/12: store-on-eofs): an in-kernel polled virtio-blk driver
# plus the eofs engine, used as a disk-backed cache for on-target compile results. Activated
# at boot only by the bare `storedisk` command-line token; without the token the feature is
# inert. Off by default; xtask enables it for the aarch64 full build only (the ECAM bring-up
# in src/pci.rs is aarch64-virt specific today).
wasm-storedisk = ["wasm-store", "dep:eo9-eofs", "dep:blake3"]
# First-poll-inline (docs/spikes/first-poll-inline.md, vendor/README.md): run callback-ABI
# guest callees inline on the caller's stack in the vendored wasmtime instead of queueing
# them to the event loop. DEFAULT-ON since the owner's GO ruling (2026-06-03): xtask's
# standard kernel feature lists include it on all three arches. The escape hatch for an
# A/B or bisection build is `EO9_KERNEL_FEATURES_REMOVE=first-poll-inline` (see xtask's
# kernel_features). The weak reference keeps host-triple (stub) builds inert.
first-poll-inline = ["wasmtime?/component-model-async-first-poll"]
# Temporary spawn-path phase tracing (docs/spikes/spawn-latency.md): per-phase micros
# accumulated across the algebra/compile/spawn host calls, one summary line per spawn.
# Measurement-only; enable with EO9_KERNEL_FEATURES_EXTRA=spawn-trace. Never default.
spawn-trace = []
# Re-run every fusion the graph cache serves from memory and assert byte equality
# (the encoder-determinism check, owner design). Verification batteries only.
graph-verify = []
# Board profile: Orange Pi 5 Plus (RK3588) — real-hardware constants instead of QEMU
# `virt` (docs/board/orange-pi-5-plus.md, plan/12). Selects the DW-APB UART2 console at
# 0xfeb5_0000 (1.5 Mbaud, left as U-Boot programmed it), the GIC-600 (GICv3) bases
# (GICD 0xfe60_0000 / GICR 0xfe68_0000), DRAM-at-zero link/MMU layout, the SMC PSCI
# conduit (TF-A BL31), the EL2->EL1 entry drop, and the 64-byte Linux `Image` boot header
# `booti` requires. Off by default — every QEMU path is byte-for-behavior unchanged.
board-opi5plus = []

# These dependencies are only used by the real bare-metal build; host-triple builds (unit
# tests, `cargo check` without --target) compile the stub entry point and need neither.
# `async` + `component-model-async` come from the patched vendor/wasmtime copy (the
# upstream feature graph requires `std` for component-model-async; see vendor/README.md).
[target.'cfg(target_os = "none")'.dependencies]
linked_list_allocator = { workspace = true }
wasmtime = { workspace = true, optional = true, features = [
    "runtime",
    "component-model",
    "async",
    "component-model-async",
] }
# The component algebra, built no_std (its dependency closure is redirected to the de-std'd
# vendored copies by this workspace's [patch.crates-io]). Only linked under `wasm-codegen`,
# since composing on metal requires the on-target compiler.
eo9-component = { path = "../../crates/eo9-component", default-features = false, optional = true }
# The eofs filesystem engine (no_std + alloc; the same crate the fs.eofs guest provider and
# the usermode mkfs use) — the on-disk format for the persistent store disk. A path
# dependency into the host workspace, like eo9-component above.
eo9-eofs = { path = "../../crates/eo9-eofs", optional = true }
# Content addressing for cached compile artifacts (cache key = blake3 of the fused
# executable bytes). Same pin as the host workspace; `no_neon` because the bare-metal
# targets have no C toolchain for the NEON kernels (mirrors crates/eo9-eofs).
blake3 = { version = "1.8.5", default-features = false, features = ["no_neon"], optional = true }
