[package]
name = "eo9-stub-net-rtl8125"
description = "Eo9 device driver `net.rtl8125`: drives a Realtek RTL8125 2.5GbE PCIe NIC through the eo9:pci capability (config space, BAR registers, DMA descriptor rings, the integrated PHY) and exports eo9:net/l2, so link-layer networking runs over real silicon by composition."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# A core wasm module that `cargo xtask build-guest` turns into a component.
crate-type = ["cdylib"]

[dependencies]
eo9-guest = { workspace = true }
# The pure device core: register map, descriptor encode/decode, PHY OCP words — all
# host-tested in the root workspace (`cargo test -p eo9-rtl8125`), consumed here the
# way fs.eofs consumes the eo9-eofs engine.
eo9-rtl8125 = { workspace = true }
wit-bindgen = { workspace = true }
