# The path-policy filesystem attenuator ("policies are programs").
[package]
name = "eo9-stub-fs-filtered"
description = "Eo9 standard stub provider `fs.filtered`: attenuates an underlying eo9:fs filesystem through a composed eo9:fs/path-policy component — every path operation is normalized, submitted to the policy, and forwarded only if permitted."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# A core wasm module that `cargo xtask build-guest` turns into a component.
crate-type = ["cdylib"]

[dependencies]
eo9-guest = { workspace = true }
wit-bindgen = { workspace = true }
