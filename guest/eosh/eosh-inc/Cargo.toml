[package]
name = "eosh-inc"
description = "Incremental parser-combinator core for the eosh per-keystroke editor (study 19): a byte-at-a-time step/admissible/completions parser whose v1 grammar mirrors eosh-core's lexer+parser as a superset, so the editor can mark dead input and offer TAB completion without ever rejecting a line the real parser accepts. no_std + alloc, dependency-free, host-tested; not yet wired into eosh (M2)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# eosh-core is the shell's single vocabulary source: the builtin cards
# (`builtins::card_words`) and the OS API cards (`apidocs::api_words`) feed the
# grammar's describe/man argument positions, so acceptance, completion, and marking
# all read the one table the session renders from. Still no_std + alloc end to end.
eosh-core = { path = "../eosh-core" }
