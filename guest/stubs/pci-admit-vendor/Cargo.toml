# The vendor/device identity admit policy for pci.filtered ("policies are programs").
[package]
name = "eo9-stub-pci-admit-vendor"
description = "Eo9 standard policy `pci.admit-vendor`: an eo9:pci/admit-policy component admitting devices by configured vendor:device identity, stable across boot configurations. Pure (imports nothing); composed as `pci.admit-vendor --allow ... $ pci.filtered $ driver`."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# A core wasm module that `cargo xtask build-guest` turns into a component.
crate-type = ["cdylib"]

[dependencies]
eo9-guest = { workspace = true }
wit-bindgen = { workspace = true }
