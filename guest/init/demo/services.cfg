# Eo9 init demo config — run with:  eo9 init guest/init/demo/services.cfg
#
# Each service line:  <name> = <program> [--flag value …] restart <policy> [--flag value …]
# Programs are /bin names (everything `eo9 store ls` shows); a composition can be
# detached by `save`-ing it under a name first (in `eo9 --svc`) and referencing that.

# A long-running worker that restart.always keeps alive: stop it with `svc stop worker`.
worker = cruncher --seed 7 --rounds 900000000 restart restart.always

# A one-shot banner whose output lands in its service log (`svc log banner`).
banner = echo --text hello-from-a-service restart restart.never

# A bounded-retry worker: exponential backoff, at most 3 restarts, starting at 500 ms.
retrier = cruncher --seed 9 --rounds 1000 restart restart.backoff --max-restarts 3 --base-delay-ms 500

# The console init keeps running in the foreground (the default is eosh anyway).
console = eosh

# What happens when the console exits while services still run:
#   always — restart it (the interactive default; owner ruling D)
#   never  — init exits with the console (the scripted/piped default)
# Uncomment to force one:
# console-restart = always
