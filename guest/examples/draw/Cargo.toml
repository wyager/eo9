[package]
name = "eo9-example-draw"
description = "Eo9 example program: draws the deterministic test pattern through eo9:gfx, reads it back, and reports the checksum (targets the eo9-examples:draw/draw world: gfx)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# A core wasm module that `cargo xtask build-guest` turns into a component.
crate-type = ["cdylib"]

[dependencies]
eo9-guest = { workspace = true }
wit-bindgen = { workspace = true }
