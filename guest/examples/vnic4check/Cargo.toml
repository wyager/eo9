[package]
name = "eo9-example-vnic4check"
description = "Eo9 example program: complete an independent UDP round-trip on each of two whole TCP/IP stacks (left, right) riding two virtual NICs of one net.l2.switch — the shared-link payoff of the single-owner-NIC design (targets the eo9-examples:vnic4check/vnic4check world)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# A core wasm module that `cargo xtask build-guest` turns into a component.
crate-type = ["cdylib"]

[dependencies]
eo9-guest = { workspace = true }
wit-bindgen = { workspace = true }
