[package]
name = "eo9-stub-net-l2-switch"
description = "Eo9 standard middleware provider `net.l2.switch`: imports one upstream eo9:net/l2 link and exports two isolated virtual NICs (port-a, port-b), each with its own locally-administered MAC."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# A core wasm module that `cargo xtask build-guest` turns into a component.
crate-type = ["cdylib"]

[dependencies]
eo9-guest = { workspace = true }
wit-bindgen = { workspace = true }
